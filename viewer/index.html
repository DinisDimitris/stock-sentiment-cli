<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Stock Analysis Board</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Daily stock sentiment snapshots</p>
        <div class="hero__heading">
          <div>
            <h1>Stock Analysis Board</h1>
            <p class="lede">
              Live view of every folder in the attached analysis directory, including the text summary and structured JSON output.
            </p>
          </div>
          <div class="hero__meta">
            <span id="stock-count" class="chip">0 tickers</span>
            <span id="last-refresh" class="chip">Waiting for data</span>
            <button id="refresh-button" class="ghost-button" type="button">Refresh</button>
          </div>
        </div>
      </header>

      <section class="status-bar" aria-label="data source information">
        <span class="status-label">Source directory</span>
        <code id="analysis-path"></code>
      </section>

      <section id="stock-grid" class="stock-grid" aria-live="polite"></section>
    </main>
  </body>
</html>
